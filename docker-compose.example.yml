# Copy to docker-compose.yml, create .env from .env.example, then: docker compose up -d --build
services:
  age-guesser:
    build: .
    container_name: immich-age-guesser
    env_file: .env
    ports:
      - "8080:8080"   # LAN only: the UI has no login and holds an Immich API key
    volumes:
      - ./data:/data  # SQLite store, calibration and the downloaded model weights
    restart: unless-stopped
    # To reach Immich by container name (IMMICH_URL=http://immich_server:2283), join its network:
    # networks: [immich]

# networks:
#   immich:
#     external: true
#     name: immich_default
