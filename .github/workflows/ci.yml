name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Publish from the default branch (as :latest) and from version tags (v1.2.3).
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: age-guesser:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (web UI starts unconfigured)
        run: |
          docker run -d --name smoke -p 8080:8080 age-guesser:test
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 2; done
          curl -fsS localhost:8080/healthz | grep -q '"configured":false'
          curl -fsS localhost:8080/settings | grep -q 'Connect the tool to your Immich server'
          docker rm -f smoke

      - name: Installed ML packages
        run: |
          docker run --rm age-guesser:test sh -c 'pip list 2>/dev/null | grep -iE "^(torch|transformers|timm|opencv|numpy|huggingface)"; python -c "import torch, transformers, timm, cv2; from transformers import AutoImageProcessor"'

      - name: Smoke test (MiVOLO model loads and runs)
        run: docker run --rm age-guesser:test immich-age-guesser check-model

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
