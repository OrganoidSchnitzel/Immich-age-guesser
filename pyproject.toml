[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-age-guesser"
version = "0.1.0"
description = "Date scanned photos in Immich from the ages of the people in them"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pillow>=10",
    "numpy>=1.26",
    "tzdata",
]

[project.optional-dependencies]
# Install torch and torchvision separately first, from the same index
# (CPU: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu).
mivolo = [
    "transformers>=4.40,<5",
    "timm>=0.9",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
]
dev = ["pytest>=8"]

[project.scripts]
immich-age-guesser = "immich_age_guesser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
immich_age_guesser = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
